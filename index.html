<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SK Panel - Admin</title>
    <style>
        body { background-color: #0f1219; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #181e2a; padding: 30px; border-radius: 8px; width: 350px; border: 1px solid #2a3548; }
        h2 { text-align: center; color: #00c8ff; }
        label { display: block; margin-bottom: 5px; color: #a0b0c0; }
        select, button, input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #2a3548; background-color: #222a3a; color: #fff; box-sizing: border-box; }
        button { background-color: #00c8ff; color: #000; font-weight: bold; cursor: pointer; }
        .resultado { margin-top: 20px; background-color: #0d1117; padding: 15px; border-radius: 6px; border: 1px solid #00c8ff; display: none; text-align: center; }
        .resultado span { font-family: monospace; color: #00ff88; font-size: 18px; display: block; margin-top: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="painelAdmin" style="display: none;">
    <h2>SK PANEL - KEYGEN</h2>
    <label>Tempo da Key:</label>
    <select id="tempoSelect">
        <option value="1">1 Dia</option>
        <option value="7">7 Dias</option>
        <option value="30">30 Dias</option>
        <option value="9999">Permanente</option>
    </select>
    <button id="btnGerar" onclick="gerarKey()">Gerar Key</button>
    <div class="resultado" id="resultadoBox">
        <strong>Sua Key é:</strong>
        <span id="keyGerada"></span>
    </div>
</div>

<div class="container" id="loginBox">
    <h2>Login Admin</h2>
    <label>Senha:</label>
    <input type="password" id="senhaInput" placeholder="Digite a senha...">
    <button onclick="logar()">Entrar</button>
</div>

<script>
    // LINK DIRETO DO GIST (NÃO PRECISA DE TOKEN)
    const GIST_RAW_URL = "https://gist.githubusercontent.com/azevedoconceicaoeduardo500-beep/73b20fea157d4dde5079c1f55e4ea062/raw"; 
    const SENHA_MESTRA = "duzinn18599z"; 

    function logar() {
        if (document.getElementById("senhaInput").value === SENHA_MESTRA) {
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("painelAdmin").style.display = "block";
        } else {
            alert("Senha incorreta!");
        }
    }

    async function gerarKey() {
        const btn = document.getElementById("btnGerar");
        btn.innerText = "Gerando...";
        btn.disabled = true;

        const dias = parseInt(document.getElementById("tempoSelect").value);
        const key = "SK-" + Math.random().toString(36).substring(2, 8).toUpperCase();
        
        const agora = Math.floor(Date.now() / 1000);
        const expiracao = (dias === 9999) ? 2147483647 : agora + (dias * 86400);

        try {
            // 1. Baixa a lista atual de keys
            const res = await fetch(GIST_RAW_URL);
            let text = await res.text();
            
            // Se o arquivo estiver vazio, cria um objeto vazio
            let obj = text && text.trim() !== "" ? JSON.parse(text) : {};
            
            // 2. Adiciona a nova key
            obj[key] = { "Expira": expiracao };

            // 3. Mostra a key para você (O salvamento automático precisa do Token, 
            // então vamos usar um método alternativo para não dar erro)
            document.getElementById("keyGerada").innerText = key;
            document.getElementById("resultadoBox").style.display = "block";
            
            // Cria o link para o seu Gist para você atualizar manualmente
            console.log("Copie isso e cole no Gist:", JSON.stringify(obj, null, 2));

        } catch (error) {
            alert("Erro ao ler o banco de dados do Gist.");
        }

        btn.innerText = "Gerar Key";
        btn.disabled = false;
    }
</script>
</body>
</html>
